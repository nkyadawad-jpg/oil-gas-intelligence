name: Hourly Qatar O&G Intelligence Sync & Deploy

on:
  schedule:
    # Runs automatically at the start of every hour (00:00, 01:00, 02:00, etc.)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Live Qatar Energy Intelligence Sync Engine
        run: |
          python refresh_data.py

      - name: Commit & Push Updated Intelligence Data
        run: |
          git config --global user.name "Qatar-Radar-Bot"
          git config --global user.email "bot@qatar-og-radar.internal"
          git add -A
          if git diff --staged --quiet; then
            echo "No new changes detected. Everything is up to date."
          else
            git commit -m "Automated Hourly Intelligence Sync: $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
            git push origin main
          fi
